name: Publish Package

on:
  push:
    tags:
      - "pi-*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Package tag to publish, for example pi-subagents-0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.6.2

      - name: Resolve release package
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: npm run check:release -- "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Check package contents
        env:
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
        run: npm pack --dry-run --workspace="$RELEASE_WORKSPACE"

      - name: Publish package
        env:
          RELEASE_WORKSPACE: ${{ steps.release.outputs.workspace }}
        run: npm publish --workspace="$RELEASE_WORKSPACE" --access public
